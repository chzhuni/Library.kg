<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Заказы{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: "Segoe UI", Arial, sans-serif; background: #f1f3f8; margin: 0; color: #1f2430; }
        header { background: #4f46e5; color: #fff; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
        header a { color: #fff; text-decoration: none; font-size: 20px; font-weight: 700; }
        .container { max-width: 1150px; margin: 0 auto; padding: 28px 20px; }
        .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        h1 { margin: 0; font-size: 26px; }
        .btn { display: inline-block; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 600; border: none; cursor: pointer; }
        .btn-primary { background: #4f46e5; color: #fff; }
        .btn-primary:hover { background: #4338ca; }
        .btn-edit { background: #e0e7ff; color: #3730a3; padding: 6px 12px; }
        .btn-edit:hover { background: #c7d2fe; }
        .btn-delete { background: #fee2e2; color: #b91c1c; padding: 6px 12px; }
        .btn-delete:hover { background: #fecaca; }
        .btn-light { background: #e5e7eb; color: #374151; }
        .btn-light:hover { background: #d1d5db; }
    </style>
    {% block extra_style %}{% endblock %}
</head>
<body>
<header>
    <a href="{% url 'order_list' %}">🛒 Мои заказы</a>
</header>
<div class="container">
    {% block content %}{% endblock %}
</div>
</body>
</html>
