{% extends 'orders/base.html' %}

{% block title %}Новый заказ{% endblock %}

{% block extra_style %}
<style>
    .form-card { background: #fff; max-width: 640px; margin: 0 auto; padding: 28px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.07); }
    .form-card h1 { margin-bottom: 20px; }
    .form-card p { margin: 0 0 16px; }
    .form-card label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #374151; }
    .form-input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff; }
    .form-input:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.15); }
    .errorlist { list-style: none; padding: 0; margin: 0 0 6px; color: #b91c1c; font-size: 13px; }
    .buttons { display: flex; gap: 10px; margin-top: 8px; }
</style>
{% endblock %}

{% block content %}
<div class="form-card">
    <h1>Новый заказ</h1>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="buttons">
            <button type="submit" class="btn btn-primary">Создать заказ</button>
            <a class="btn btn-light" href="{% url 'order_list' %}">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
