<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library.kg — Книги</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f5f7; margin: 0; color: #222; }
        header { background: #1f3a5f; color: #fff; padding: 18px 24px; font-size: 22px; font-weight: bold; }
        .container { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .card { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.1); display: flex; flex-direction: column; }
        .card img { width: 100%; height: 300px; object-fit: cover; display: block; }
        .card-body { padding: 14px; display: flex; flex-direction: column; flex: 1; }
        .genre { align-self: flex-start; background: #e8f0fe; color: #1a56c4; font-size: 12px; padding: 3px 10px; border-radius: 12px; }
        .card h2 { font-size: 18px; margin: 10px 0 4px; }
        .author { color: #666; font-size: 14px; margin-bottom: 8px; }
        .price { font-weight: bold; font-size: 16px; margin-top: auto; }
        .stock { font-size: 13px; margin: 4px 0 10px; }
        .in { color: #1e8e3e; } .out { color: #d93025; }
        .btn { display: block; text-align: center; padding: 8px; background: #1a56c4; color: #fff; text-decoration: none; border-radius: 6px; font-size: 14px; }
        .btn:hover { background: #12409a; }
    </style>
</head>
<body>
<header>Library.kg</header>
<div class="container">
    <h1>Все книги</h1>
    <div class="grid">
        {% for book in books %}
        <div class="card">
            <img src="{{ book.cover.url }}" alt="{{ book.title }}">
            <div class="card-body">
                <span class="genre">{{ book.genre }}</span>
                <h2>{{ book.title }}</h2>
                <div class="author">{{ book.author }}</div>
                <div class="price">{{ book.price }} сом</div>
                <div class="stock">
                    {% if book.is_available %}<span class="in">В наличии</span>{% else %}<span class="out">Нет в наличии</span>{% endif %}
                </div>
                <a class="btn" href="{% url 'book_detail' book.id %}">Подробнее</a>
            </div>
        </div>
        {% empty %}
        <p>Пока нет ни одной книги.</p>
        {% endfor %}
    </div>
</div>
</body>
</html>
